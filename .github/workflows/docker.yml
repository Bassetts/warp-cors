name: docker

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  docker-build:
    name: build docker image
    runs-on: ubuntu-latest
    steps:
      - name: Get the release version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Get short release version
        id: get_short_version
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: echo "version=${RELEASE_VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            bassetts/warp-cors:${{ steps.get_version.outputs.version }}
            bassetts/warp-cors:${{ steps.get_short_version.outputs.version }}
            bassetts/warp-cors:latest
