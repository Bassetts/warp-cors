name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-release:
    name: build release
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            rust: nightly
            target: x86_64-unknown-linux-musl
          - build: linux-arm
            os: ubuntu-latest
            rust: nightly
            target: arm-unknown-linux-gnueabihf
          - build: macos
            os: macos-15-intel
            rust: nightly
            target: x86_64-apple-darwin
          - build: macos-arm
            os: macos-latest
            rust: nightly
            target: aarch64-apple-darwin
          - build: win-msvc
            os: windows-latest
            rust: nightly
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: runner.os == 'Linux'
        run: cargo install cross --locked

      - name: Build release binary
        if: runner.os == 'Linux'
        run: cross build --verbose --locked --release --target ${{ matrix.target }}

      - name: Build release binary
        if: runner.os != 'Linux'
        run: cargo build --verbose --locked --release --target ${{ matrix.target }}

      - name: Build archive
        id: build_archive
        shell: bash
        run: |
          staging="warp-cors-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp README.md LICENSE "$staging/"

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/warp-cors.exe" "$staging/"
            7z a "$staging.zip" "$staging"
            echo "asset=$staging.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/warp-cors" "$staging/"
            tar czf "$staging.tar.gz" "$staging"
            echo "asset=$staging.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.build_archive.outputs.asset }}
          if-no-files-found: error

  create-release:
    name: create release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create github release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG"
